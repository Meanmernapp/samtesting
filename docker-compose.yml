services:
  voiceai-api:
    build: ./ai
    ports:
      - "8000:8000"
    environment:
      - COQUI_TOS_AGREED=1
      - VOICEAI_WARMUP=false
      - CORS_ORIGINS=http://localhost:5500,http://127.0.0.1:5500,https://*.vercel.app
    volumes:
      - voiceai-data:/data
    restart: unless-stopped

volumes:
  voiceai-data:
